; The Pipecat flavor: Deepgram hears the caller, gpt-4o answers, Piper speaks.
; Swap any service by naming another section below.

[pipecat]
stt = deepgram
tts = lessac
llm = gpt
welcome_message = Hello! How can I help you?
instructions = You help the callers of a shop. If the caller asks for a person, transfer the call. When the caller is done, say goodbye and hang up.
tools = /app/cfg/functions.py
mcp_servers = shop
;transfer_to = sip:operator@example.com

[mcp:shop]
command = python3 /app/cfg/mcp_server.py

; Speech to text

[stt:deepgram]
type = deepgram
key = #TODO: add your Deepgram key

; local, on the CPU
[stt:whisper]
type = whisper
model = base.en
language = en

; Text to speech

; local
[tts:lessac]
type = piper
voice = en_US-lessac-medium

[tts:deepgram]
type = deepgram
key = #TODO: add your Deepgram key
voice = aura-2-thalia-en

; LLMs

[llm:gpt]
type = openai
key = #TODO: add your OpenAI key
model = gpt-4o

; a local model served by llama.cpp on the host, e.g.:
; llama-server -m model.gguf --jinja --reasoning-budget 0 --port 8080
[llm:local]
type = openai
url = http://host.docker.internal:8080/v1
key = none
model = local

; a VoiceAgent that opens support tickets
[llm:support]
type = langchain
model = openai:gpt-4o
key = #TODO: add your OpenAI key
agent = /app/cfg/support_agent.py:SupportAgent
